    if (s) return JSON.parse(s);
  } catch(e) {}
  return {
    avatar: '🦁',
    name: '',
    xp: 0,
    wordsCorrect: 0,
    quizzesCompleted: 0,
    perfectQuizzes: 0,
    streak: 0,
    lastDate: null,
    unlockedBadges: [],

  };
}
function saveState(state) {
  try { localStorage.setItem('englishkids_v2', JSON.stringify(state)); } catch(e) {}

// ─── EMOJI IMAGE ─────────────────────────────────────────────────
function EmojiImg({ code, size = 72, style = {} }) {
  const [err, setErr] = useState(false);
  const url = emojiToUrl(code);
  
  // fallback to native emoji
  if (err) {
    const emoji = (() => {
      try { return String.fromCodePoint(...code.split('-').map(p => parseInt(p, 16))); }
      catch { return '🔵'; }
    })();
    return (
      <span style={{ fontSize: size * 0.7, lineHeight: 1, display: 'block', textAlign: 'center', ...style }}>
        {emoji}
      </span>
    );
  }
  
  return (
    <img
      src={url}
      alt=""
      width={size}
      height={size}
      onError={() => setErr(true)}
      style={{ objectFit: 'contain', display: 'block', imageRendering: 'crisp-edges', ...style }}
      draggable={false}
    />
  );
}

// ─── XP / LEVEL ──────────────────────────────────────────────────
function getPlayerLevel(xp) {
  const lvls = [
    { lvl: 1, min: 0,   label: 'Principiante', color: '#6bcb77' },
    { lvl: 2, min: 50,  label: 'Aprendiz',     color: '#4d96ff' },
    { lvl: 3, min: 150, label: 'Explorador',   color: '#c77dff' },
    { lvl: 4, min: 300, label: 'Aventurero',   color: '#ffd93d' },
    { lvl: 5, min: 500, label: 'Campeón',       color: '#ff6b9d' },
    { lvl: 6, min: 800, label: 'Maestro',       color: '#ff6b6b' },
  ];
  let cur = lvls[0];
  for (const l of lvls) { if (xp >= l.min) cur = l; else break; }
  const next = lvls[lvls.indexOf(cur)+1];
  const pct = next ? ((xp - cur.min) / (next.min - cur.min)) * 100 : 100;
  return { ...cur, next, pct };
}

// ─── STARS EFFECT ────────────────────────────────────────────────
function launchStars(count = 12) {
  const ems = ['⭐','🌟','✨','🎊','🎉','💫','🥳','🏆'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;bottom:80px;left:${15+Math.random()*70}%;font-size:${1.5+Math.random()}rem;pointer-events:none;z-index:9999;animation:starFly ${0.8+Math.random()*0.7}s ease-out forwards;`;
      el.textContent = ems[Math.floor(Math.random() * ems.length)];
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }, i * 60);
  }
}

// ─── LEARN SCREEN ────────────────────────────────────────────────
function LearnScreen({ state, onStateChange }) {
  const [levelId, setLevelId] = useState('basic');
  const [catId, setCatId]     = useState(CATEGORIES.basic[0].id);
  const [selectedItem, setSelectedItem] = useState(null);
  const [feedback, setFeedback] = useState(null); // {type, text}
  const [isListening, setIsListening] = useState(false);
  const [isCountdown, setIsCountdown] = useState(false);
  const [countdown, setCountdown]     = useState(3);
  const [selectedCardEl, setSelectedCardEl] = useState(null);

  const hasSynth = typeof speechSynthesis !== 'undefined';
  const hasSpeechRec = !!(window.SpeechRecognition || window.webkitSpeechRecognition) && hasSynth;

  const level = LEVELS.find(l => l.id === levelId);
  const cats  = CATEGORIES[levelId];
  const cat   = cats.find(c => c.id === catId) || cats[0];

  const speak = useCallback((item) => {
    if (!hasSynth) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(item.en);
    u.lang = 'en-GB'; u.rate = item.p ? 0.7 : 0.75; u.pitch = 1.1;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.startsWith('en'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }, [hasSynth]);

  const selectItem = (item) => {
    if (selectedItem === item) { speak(item); return; }
    setSelectedItem(item);
    setFeedback(null);
    setIsListening(false);
    setIsCountdown(false);
    speak(item);
  };

  const startRepeatFlow = () => {
    if (!selectedItem) return;
    speak(selectedItem);
    setFeedback({ type:'info', text:'🎧 Escucha... luego repite' });
    const dur = Math.max(1300, selectedItem.en.length * 75);
    setTimeout(() => beginCountdown(), dur);
  };

  const beginCountdown = () => {
    setIsCountdown(true);
    setCountdown(3);
    setFeedback({ type:'info', text:'⏳ ¡Prepárate!' });
    let rem = 3;
    const t = setInterval(() => {
      rem--;
      setCountdown(rem);
      if (rem <= 0) { clearInterval(t); setIsCountdown(false); startListening(); }
    }, 1000);
  };

  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR || !selectedItem) return;
    setIsListening(true);
    setFeedback({ type:'info', text:'🎤 ¡Habla ahora!' });
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 6;
    const safe = setTimeout(() => { try { rec.stop(); } catch(e) {} }, 8000);

    rec.onresult = (ev) => {
      clearTimeout(safe); setIsListening(false);
      const alts = Array.from(ev.results[0]).map(r => r.transcript.trim().toLowerCase());
      const target = selectedItem.en.toLowerCase();
      const ok = alts.some(a => a === target || a.includes(target) ||
        target.split(' ').filter(w=>w.length>2).some(t=>a.includes(t)));
      if (ok) {
        setFeedback({ type:'good', text: ['🎉 ¡Perfecto!','🌟 ¡Brillante!','⭐ ¡Genial!','🏆 ¡Campeón!','💫 ¡Increíble!'][Math.floor(Math.random()*5)] });
        launchStars();
        const newState = {
          ...state,
          xp: state.xp + 10,
          wordsCorrect: state.wordsCorrect + 1,
          learnedWords: { ...state.learnedWords, [selectedItem.en]: true }
        };
        // check badges
        const newBadges = checkBadges(newState);
        newState.unlockedBadges = newBadges;
        onStateChange(newState);
      } else {
        const heard = alts[0] || '';
        setFeedback({ type:'bad', text: `🙊 ¡Casi! "${heard}" — ¡otra vez!` });
      }
    };
    rec.onerror = () => { clearTimeout(safe); setIsListening(false); setFeedback({ type:'bad', text:'🙈 No te oí. ¡Inténtalo de nuevo!' }); };
    rec.onend   = () => { clearTimeout(safe); setIsListening(false); };
    try { rec.start(); } catch(e) { setIsListening(false); }
  };

  const fColor = { good:'#6bcb77', bad:'#ff6b9d', info:'#4d96ff' };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
      {/* Level selector */}
      <div style={{ padding:'12px 16px 0', flexShrink:0 }}>
        <div style={{ display:'flex', gap:8 }}>
          {LEVELS.map(lv => (
            <button key={lv.id} onClick={() => { setLevelId(lv.id); setCatId(CATEGORIES[lv.id][0].id); setSelectedItem(null); setFeedback(null); }} style={{
              flex:1, padding:'8px 4px', borderRadius:14, border: lv.id===levelId ? 'none' : '2px solid rgba(255,255,255,0.15)',
              background: lv.id===levelId ? lv.color : 'rgba(255,255,255,0.05)',
              color: lv.id===levelId ? '#fff' : 'rgba(255,255,255,0.5)',
              fontFamily:'Nunito', fontWeight:900, fontSize:'0.75rem', cursor:'pointer',
              transition:'all .2s'
            }}>
              {lv.icon} {lv.label}
            </button>
          ))}
        </div>
      </div>

      {/* Category tabs */}
      <div style={{ display:'flex', gap:8, padding:'10px 16px', overflowX:'auto', flexShrink:0, scrollbarWidth:'none' }}>
        {cats.map(c => (
          <button key={c.id} onClick={() => { setCatId(c.id); setSelectedItem(null); setFeedback(null); }} style={{
            padding:'7px 16px', borderRadius:50, border: c.id===catId ? 'none' : '2px solid rgba(255,255,255,0.12)',
            background: c.id===catId ? c.color : 'rgba(255,255,255,0.05)',
            color: c.id===catId ? '#fff' : 'rgba(255,255,255,0.5)',
            fontFamily:'Nunito', fontWeight:800, fontSize:'0.8rem', cursor:'pointer',
            whiteSpace:'nowrap', flexShrink:0, transition:'all .2s'
          }}>
            {c.icon} {c.label}
          </button>
        ))}
      </div>

      {/* Grid */}
      <div style={{ flex:1, overflowY:'auto', padding:'4px 12px 12px', display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))', gap:12, alignContent:'start' }}>
        {cat.items.map((item, idx) => {
          const isSelected = selectedItem?.en === item.en;
          const isLearned  = !!state.learnedWords[item.en];
          return (
            <button key={item.en} onClick={() => selectItem(item)} style={{
              background: isSelected ? `${cat.color}22` : 'rgba(255,255,255,0.06)',
              border: `2px solid ${isSelected ? cat.color : (isLearned ? cat.color+'55' : 'rgba(255,255,255,0.1)')}`,
              borderRadius:20, padding:'14px 10px 12px', cursor:'pointer',
              display:'flex', flexDirection:'column', alignItems:'center', gap:8,
              transition:'all .2s', transform: isSelected ? 'translateY(-4px) scale(1.04)' : 'scale(1)',
              boxShadow: isSelected ? `0 8px 24px ${cat.color}44` : 'none',
              position:'relative', animationDelay:`${idx * 0.03}s`, animation:'fadeUp .3s ease both'
            }}>
              {isLearned && (
                <div style={{ position:'absolute', top:6, right:6, width:16, height:16, borderRadius:'50%', background:cat.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.55rem', color:'#fff', fontWeight:900 }}>✓</div>
              )}
              <div style={{ width:72, height:72, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:50, background: `${cat.color}18`, overflow:'hidden' }}>
                <EmojiImg code={item.e} size={60} />
              </div>
              <div style={{ fontFamily:'Fredoka One', fontSize:'0.95rem', color:'#fff', lineHeight:1.2, textAlign:'center' }}>{item.en}</div>
              <div style={{ fontSize:'0.72rem', color:'rgba(255,255,255,0.4)', fontWeight:700, textAlign:'center' }}>{item.es}</div>
            </button>
          );
        })}
      </div>

      {/* Bottom action panel */}
      {selectedItem && (
        <div style={{ flexShrink:0, background:'rgba(10,8,35,0.96)', backdropFilter:'blur(20px)', borderTop:'1px solid rgba(255,255,255,0.1)', padding:'12px 16px 16px' }}>
          {isCountdown && (
            <div style={{ textAlign:'center', marginBottom:8, fontFamily:'Fredoka One', fontSize:'2rem', color:'#6bcb77', animation:'pulse .5s ease infinite' }}>
              {countdown}
            </div>
          )}
          {feedback && (
            <div style={{ textAlign:'center', fontWeight:900, fontSize:'1rem', color:fColor[feedback.type]||'#fff', marginBottom:8, minHeight:28 }}
              dangerouslySetInnerHTML={{ __html: feedback.text }} />
          )}
          <div style={{ display:'flex', gap:8 }}>
            <ActionBtn color="#4d96ff" onClick={() => speak(selectedItem)} label="🔊 Escuchar" />
            {hasSpeechRec && (
              <ActionBtn color="#6bcb77" onClick={startRepeatFlow} disabled={isListening || isCountdown}
                label={isListening ? <MicWaves /> : '🎤 ¡Repite!'} />
            )}
          </div>
        </div>
      )}
    </div>
  );
}

  return (
    <button onClick={onClick} disabled={disabled} style={{

// ─── QUIZ SCREEN ─────────────────────────────────────────────────
function QuizScreen({ state, onStateChange }) {
  const [phase, setPhase]         = useState('setup'); // setup | playing | result
  const [levelId, setLevelId]     = useState('basic');
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx]           = useState(0);
  const [score, setScore]         = useState(0);
  const [chosen, setChosen]       = useState(null);
  const [showAns, setShowAns]     = useState(false);

  const QUIZ_LEN = 10;

  const startQuiz = () => {
    const cats = CATEGORIES[levelId];
    const allItems = cats.flatMap(c => c.items.map(it => ({ ...it, catColor: c.color })));
    // shuffle and pick QUIZ_LEN
    const shuffled = [...allItems].sort(() => Math.random() - .5).slice(0, QUIZ_LEN);
    const qs = shuffled.map(item => {
      // 4 options: correct + 3 wrong from same level
      const others = allItems.filter(i => i.en !== item.en).sort(() => Math.random() - .5).slice(0, 3);
      const opts = [...others, item].sort(() => Math.random() - .5);
      return { item, opts };
    });
    setQuestions(qs); setQIdx(0); setScore(0); setChosen(null); setShowAns(false);
    setPhase('playing');
  };

  const pick = (opt) => {
    if (showAns) return;
    setChosen(opt);
    setShowAns(true);
    const correct = opt.en === questions[qIdx].item.en;
    if (correct) {
      setScore(s => s + 1);
      launchStars(6);
    }
    setTimeout(() => {
      if (qIdx + 1 >= questions.length) {
        finishQuiz(correct ? score + 1 : score);
      } else {
        setQIdx(i => i + 1);
        setChosen(null);
        setShowAns(false);
      }
    }, 1200);
  };

  const finishQuiz = (finalScore) => {
    const perfect = finalScore === QUIZ_LEN;
    const newState = {
      ...state,
      xp: state.xp + finalScore * 5,
      quizzesCompleted: state.quizzesCompleted + 1,
      perfectQuizzes: state.perfectQuizzes + (perfect ? 1 : 0),
    };
    newState.unlockedBadges = checkBadges(newState);
    onStateChange(newState);
    setScore(finalScore);
    setPhase('result');
  };

  const q = questions[qIdx];
  const pct = questions.length ? ((qIdx) / questions.length) * 100 : 0;

  if (phase === 'setup') return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'32px 24px', gap:24 }}>
      <div style={{ fontSize:'4rem', animation:'pop .4s ease both' }}>🎯</div>
      <h2 style={{ fontFamily:'Fredoka One', fontSize:'2rem', color:'#fff', textAlign:'center' }}>
        ¡Hora del Quiz!
      </h2>
      <p style={{ color:'rgba(255,255,255,0.5)', textAlign:'center', fontWeight:700 }}>
        10 preguntas · ¿Puedes acertar todas?
      </p>
      <div style={{ width:'100%', maxWidth:320 }}>
        <p style={{ color:'rgba(255,255,255,0.6)', fontWeight:800, marginBottom:10, fontSize:'0.85rem' }}>Elige nivel:</p>
        {LEVELS.map(lv => (
          <button key={lv.id} onClick={() => setLevelId(lv.id)} style={{
            width:'100%', padding:'13px 20px', borderRadius:16, border: lv.id===levelId ? 'none' : '2px solid rgba(255,255,255,0.15)',
            background: lv.id===levelId ? lv.color : 'rgba(255,255,255,0.06)',
            color: '#fff', fontFamily:'Nunito', fontWeight:900, fontSize:'1rem',
            cursor:'pointer', marginBottom:8, textAlign:'left', transition:'all .2s'
          }}>
            {lv.icon} {lv.label}
          </button>
        ))}
      </div>
      <button onClick={startQuiz} style={{ ...btnStyle('#ff6b9d'), maxWidth:320, marginTop:8 }}>
        ¡Empezar Quiz! 🚀
      </button>
    </div>
  );

  if (phase === 'result') {
    const pct100 = (score / QUIZ_LEN) * 100;
    const msg = score === QUIZ_LEN ? ['¡PERFECTO! 🏆','¡Eres increíble!'] :
                score >= 7 ? ['¡Muy bien! ⭐','¡Casi perfecto!'] :
                score >= 5 ? ['¡Bien hecho! 👍','¡Sigue practicando!'] :
                             ['¡Sigue así! 💪','La práctica hace al maestro'];
    if (score === QUIZ_LEN) launchStars(20);
    return (
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'32px 24px', gap:20 }}>
        <div style={{ fontSize:'5rem', animation:'pop .5s ease both' }}>
          {score===QUIZ_LEN?'🏆':score>=7?'⭐':score>=5?'👍':'💪'}
        </div>
        <h2 style={{ fontFamily:'Fredoka One', fontSize:'2.2rem', color:'#fff', textAlign:'center' }}>{msg[0]}</h2>
        <p style={{ color:'rgba(255,255,255,0.5)', fontWeight:700 }}>{msg[1]}</p>
        <div style={{ background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:24, padding:'28px 40px', textAlign:'center' }}>
          <div style={{ fontFamily:'Fredoka One', fontSize:'3.5rem', color: score===QUIZ_LEN?'#ffd93d':score>=7?'#6bcb77':'#4d96ff' }}>
            {score} / {QUIZ_LEN}
          </div>
          <div style={{ color:'rgba(255,255,255,0.5)', fontWeight:700, marginTop:4 }}>respuestas correctas</div>
          <div style={{ height:8, background:'rgba(255,255,255,0.1)', borderRadius:50, marginTop:16, overflow:'hidden' }}>
            <div style={{ height:'100%', width:`${pct100}%`, background:'linear-gradient(90deg,#4d96ff,#ff6b9d)', borderRadius:50 }} />
          </div>
          <div style={{ marginTop:10, color:'#ffd93d', fontWeight:900, fontFamily:'Fredoka One', fontSize:'1.1rem' }}>
            +{score * 5} XP ganados
          </div>
        </div>
        <button onClick={() => setPhase('setup')} style={{ ...btnStyle('#4d96ff'), maxWidth:280 }}>
          Otro Quiz 🔄
        </button>
      </div>
    );
  }

  // playing
  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'16px', gap:16, overflow:'auto' }}>
      {/* Progress bar */}
      <div style={{ display:'flex', alignItems:'center', gap:12 }}>
        <div style={{ flex:1, height:8, background:'rgba(255,255,255,0.1)', borderRadius:50, overflow:'hidden' }}>
          <div style={{ height:'100%', width:`${pct}%`, background:'linear-gradient(90deg,#6bcb77,#4d96ff)', borderRadius:50, transition:'width .4s ease' }} />
        </div>
        <span style={{ fontFamily:'Fredoka One', color:'rgba(255,255,255,0.6)', fontSize:'0.9rem', flexShrink:0 }}>
          {qIdx+1}/{QUIZ_LEN}
        </span>
        <span style={{ fontFamily:'Fredoka One', color:'#ffd93d', fontSize:'0.9rem', flexShrink:0 }}>
          ⭐ {score}
        </span>
      </div>

      {/* Question */}
      <div style={{ textAlign:'center', animation:'fadeUp .3s ease both' }}>
        <p style={{ color:'rgba(255,255,255,0.5)', fontWeight:800, fontSize:'0.85rem', marginBottom:12, textTransform:'uppercase', letterSpacing:'0.05em' }}>
          ¿Cuál es esta imagen?
        </p>
        <div style={{ width:140, height:140, margin:'0 auto 16px', background:`${q.item.catColor}22`, borderRadius:32, display:'flex', alignItems:'center', justifyContent:'center', border:`3px solid ${q.item.catColor}44` }}>
          <EmojiImg code={q.item.e} size={110} />
        </div>
      </div>

      {/* Options */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
        {q.opts.map((opt, i) => {
          const isCorrect = opt.en === q.item.en;
          const isChosen  = chosen?.en === opt.en;
          let bg = 'rgba(255,255,255,0.07)';
          let border = '2px solid rgba(255,255,255,0.12)';
          let textC = '#fff';
          if (showAns) {
            if (isCorrect) { bg='rgba(107,203,119,0.25)'; border='2px solid #6bcb77'; textC='#6bcb77'; }
            else if (isChosen) { bg='rgba(255,107,157,0.2)'; border='2px solid #ff6b9d'; textC='#ff6b9d'; }
          }
          return (
            <button key={opt.en} onClick={() => pick(opt)} style={{
              padding:'16px 10px', borderRadius:18, border, background: bg,
              color: textC, fontFamily:'Nunito', fontWeight:900, fontSize:'0.95rem',
              cursor: showAns ? 'default' : 'pointer', transition:'all .2s',
              animation: showAns && isChosen && !isCorrect ? 'wrong .3s ease' : 'none',
              textAlign:'center', lineHeight:1.2
            }}>
              {opt.en}
              {showAns && isCorrect && ' ✓'}
            </button>
          );
        })}
      </div>

      {/* Hint */}
      <div style={{ textAlign:'center', color:'rgba(255,255,255,0.3)', fontSize:'0.8rem', fontWeight:700 }}>
        {q.item.es}
      </div>
    </div>
  );
}

// ─── BADGES SCREEN ───────────────────────────────────────────────
function BadgesScreen({ state }) {
  const earned = state.unlockedBadges || [];
  return (
    <div style={{ flex:1, overflowY:'auto', padding:'20px 16px' }}>
      <h2 style={{ fontFamily:'Fredoka One', color:'#fff', fontSize:'1.6rem', marginBottom:4 }}>Logros</h2>
      <p style={{ color:'rgba(255,255,255,0.4)', fontWeight:700, fontSize:'0.85rem', marginBottom:20 }}>
        {earned.length} / {BADGES.length} desbloqueados
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
        {BADGES.map((b, i) => {
          const unlocked = earned.includes(b.id);
          return (
            <div key={b.id} style={{
              background: unlocked ? 'rgba(255,217,61,0.1)' : 'rgba(255,255,255,0.04)',
              border: unlocked ? '2px solid rgba(255,217,61,0.4)' : '2px solid rgba(255,255,255,0.08)',
              borderRadius:20, padding:'18px 14px', textAlign:'center',
              opacity: unlocked ? 1 : 0.45, transition:'all .3s',
              animation:`fadeUp .4s ease ${i*.04}s both`
            }}>
              <div style={{ fontSize:'2.5rem', marginBottom:8, filter: unlocked ? 'none' : 'grayscale(1)' }}>
                {b.icon}
              </div>
              <div style={{ fontFamily:'Fredoka One', color: unlocked ? '#ffd93d' : 'rgba(255,255,255,0.6)', fontSize:'0.9rem', marginBottom:4 }}>
                {b.label}
              </div>
              <div style={{ fontSize:'0.7rem', color:'rgba(255,255,255,0.35)', fontWeight:700, lineHeight:1.4 }}>
                {b.desc}
              </div>
              {unlocked && (
                <div style={{ marginTop:8, fontSize:'0.7rem', color:'#6bcb77', fontWeight:900 }}>
                  ✓ Desbloqueado
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── BADGE CHECK ─────────────────────────────────────────────────
function checkBadges(state) {
  const badges = [...(state.unlockedBadges || [])];
  for (const b of BADGES) {
    if (badges.includes(b.id)) continue;
    let val = 0;
    if (b.type === 'words') val = state.wordsCorrect;
    else if (b.type === 'quizzes') val = state.quizzesCompleted;
    else if (b.type === 'perfectQuizzes') val = state.perfectQuizzes;
    else if (b.type === 'streak') val = state.streak;
    if (val >= b.threshold) badges.push(b.id);
  }
  return badges;
}

// ─── MAIN APP ────────────────────────────────────────────────────
function App() {
  const [state, setStateRaw] = useState(loadState);
  const [screen, setScreen] = useState('home');

  const setState = (s) => { setStateRaw(s); saveState(s); };

  // Onboarding check
  if (!state.name) return <Onboarding onDone={(p) => setState({ ...state, ...p })} />;

  const screens = {
    home:   <HomeScreen   state={state} onNavigate={setScreen} />,
    learn:  <LearnScreen  state={state} onStateChange={setState} />,
    quiz:   <QuizScreen   state={state} onStateChange={setState} />,
    badges: <BadgesScreen state={state} />,
  };

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', position:'relative', background:'linear-gradient(160deg,#0f0c29 0%,#1a1548 60%,#0f2457 100%)' }}>
      <BgBlobs />

      {/* Status bar simulation */}
      <div style={{ height: 'env(safe-area-inset-top,0px)', background:'transparent', flexShrink:0 }} />

      {/* Top bar */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 16px 6px', flexShrink:0, position:'relative', zIndex:10 }}>
        <div style={{ fontFamily:'Fredoka One', fontSize:'1.3rem', color:'#fff', display:'flex', alignItems:'center', gap:8 }}>
          <span>🌍</span> English Kids
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{ background:'rgba(255,217,61,0.15)', border:'1px solid rgba(255,217,61,0.3)', borderRadius:50, padding:'5px 12px', display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:'0.9rem' }}>⚡</span>
            <span style={{ fontFamily:'Fredoka One', color:'#ffd93d', fontSize:'0.95rem' }}>{state.xp}</span>
          </div>
          <div style={{ fontSize:'1.6rem', width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(255,255,255,0.08)', borderRadius:12 }}>
            {state.avatar}
          </div>
        </div>
      </div>

      {/* Screen content */}
      <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column', position:'relative', zIndex:1 }}
        key={screen}>
        {screens[screen]}
      </div>

      {/* Bottom Nav */}
      <BottomNav active={screen} onChange={setScreen} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
