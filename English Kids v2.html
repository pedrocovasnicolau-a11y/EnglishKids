<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --nav-h: 68px; }
  html, body { height: 100%; width: 100%; font-family: 'Nunito', sans-serif; overflow: hidden; background: #87ceeb; }
  #root { height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

  @keyframes fadeUp    { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes popIn     { 0%{transform:scale(0.85);opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  @keyframes wrongShake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @keyframes starFly   { 0%{transform:translateY(0) scale(1) rotate(0deg);opacity:1} 100%{transform:translateY(-280px) scale(0.1) rotate(720deg);opacity:0} }
  @keyframes wave      { 0%,100%{height:5px} 50%{height:22px} }
  @keyframes twinkle   { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }
  @keyframes cloudFloat{ from{transform:translateX(0)} to{transform:translateX(110vw)} }
  @keyframes sunPulse  { 0%,100%{box-shadow:0 0 40px #ffd93daa,0 0 80px #ffb34755} 50%{box-shadow:0 0 60px #ffd93ddd,0 0 120px #ffb34799} }
  @keyframes slideIn   { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
</style>
</head>
<body>
<div id="root"></div>

<!-- Data & helpers -->
<script src="data.js"></script>

<!-- Shared components (React/JSX) -->
<script type="text/babel" src="components.jsx"></script>

<!-- Screen components -->
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-learn.jsx"></script>
<script type="text/babel" src="screens-duo.jsx"></script>

<!-- Main App -->
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [appState, setAppStateRaw] = useState(loadState);
  const [screen, setScreen] = useState('home');

  const setAppState = (s) => { setAppStateRaw(s); saveState(s); };

  // Update streak on load
  useEffect(() => {
    const today = new Date().toDateString();
    if (appState.lastDate !== today && appState.name) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      const newStreak = appState.lastDate === yesterday ? (appState.streak||0)+1 : 1;
      const ns = { ...appState, lastDate: today, streak: newStreak };
      ns.unlockedBadges = checkBadges(ns);
      setAppState(ns);
    }
  }, []);

  // Onboarding
  if (!appState.name) {
    return (
      <div style={{ height:'100%', position:'relative' }}>
        <SkyBackground />
        <div style={{ position:'relative', zIndex:1, height:'100%' }}>
          <Onboarding onDone={(p) => setAppState({ ...appState, ...p })} />
        </div>
      </div>
    );
  }

  const screens = {
    home:   <HomeScreen   state={appState} onNavigate={setScreen} />,
    learn:  <LearnScreen  state={appState} onStateChange={setAppState} />,
    write:  <WriteScreen  state={appState} onStateChange={setAppState} />,
    quiz:   <QuizScreen   state={appState} onStateChange={setAppState} />,
    duo:    <DuoScreen    state={appState} onStateChange={setAppState} />,
    badges: <BadgesScreen state={appState} />,
  };

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', position:'relative' }}>
      <SkyBackground />
      <div style={{ position:'relative', zIndex:1, display:'flex', flexDirection:'column', height:'100%' }}>
        <TopBar state={appState} />
        <div key={screen} style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column', animation:'slideIn .25s ease both' }}>
          {screens[screen]}
        </div>
        <BottomNav active={screen} onChange={setScreen} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
